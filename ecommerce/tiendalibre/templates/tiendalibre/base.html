<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Libre</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Fuente Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --bg-body-light: #f1f5f9; /* Gris muy clarito, casi blanco */
      --navbar-navy: #0f172a;    /* Navbar azul oscuro profesional */
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.01em;
      background-color: var(--bg-body-light);
      color: #0f172a;
    }
    .bg-navy {
      background-color: var(--navbar-navy) !important;
    }
    .text-accent {
      color: var(--accent-color) !important;
    }
    .btn-accent {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
    }
    .btn-accent:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }
    .btn-outline-accent {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }
    .btn-outline-accent:hover {
      background-color: var(--accent-color);
      color: #fff;
    }
  </style>

  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- Navbar en Azul Oscuro (Navy) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-navy shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="{% url 'home' %}">
        🛒 Tienda<span class="text-accent">Libre</span>
        </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link fw-medium" href="{% url 'home' %}">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-medium" href="{% url 'catalogo' %}">Catálogo</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  {% block content %}
  {% endblock %}

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
